<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>T04 – SVG House &amp; Garden</title>
	<style>
		body {
			margin: 0;
			padding: 2rem;
			color: #263238;
			background: #f4f7f5;
			font-family: Georgia, "Times New Roman", serif;
		}

		main {
			max-width: 800px;
			margin: 0 auto;
		}

		figure {
			margin: 0 0 1.5rem;
		}

		figcaption {
			margin-top: 0.4rem;
			font-size: 0.95rem;
		}

		h1 {
			margin: 0 0 1rem;
			font-size: 1.6rem;
		}

		svg {
			display: block;
			width: 100%;
			height: auto;
			border: 2px solid #536b61;
			border-radius: 6px;
			background: #d9f0f7;
		}

		#scene-annotated #annotations {
			font-size: 12px;
			fill: #333;
			stroke: #999;
			stroke-width: 1;
			pointer-events: none;
		}

		#scene-annotated #annotations text {
			stroke: none;
		}

		/* Give the adjusted scene stronger outlines and a varied garden palette. */
		#scene-adjusted .sky { fill: #c6e5f2; }
		#scene-adjusted .lawn { fill: #75ad59; }
		#scene-adjusted .tree-trunk { fill: #69452e; stroke: #49321f; stroke-width: 2; }
		#scene-adjusted .tree-canopy { fill: #347b45; stroke: #205632; stroke-width: 2; }
		#scene-adjusted .house-body { fill: #f3cb7c; stroke: #70472f; stroke-width: 3; }
		#scene-adjusted .roof { fill: #913f35; stroke: #572923; stroke-width: 4; }
		#scene-adjusted .chimney { fill: #774338; stroke: #542d27; stroke-width: 2; }
		#scene-adjusted .door { fill: #68432f; stroke: #442c20; stroke-width: 2; }
		#scene-adjusted .window { fill: #a1d9e5; stroke: #493e32; stroke-width: 5; }
		#scene-adjusted .window-divider { stroke: #493e32; stroke-width: 3; }
		#scene-adjusted .fence polyline,
		#scene-adjusted .fence line { stroke: #405d39; stroke-width: 4; stroke-dasharray: 8 5; }
		#scene-adjusted .garden-path { fill: #9c998b; stroke: #55564f; stroke-width: 2; }
		#scene-adjusted .stone-walkway { fill: #c9c7b9; stroke: #55564f; stroke-width: 2; }
		#scene-adjusted .stone-joint { fill: none; stroke: #8d8c82; stroke-width: 2; }
		#scene-adjusted .mailbox { fill: #315f78; stroke: #193d52; stroke-width: 2; }
		#scene-adjusted .smoke { fill: #fff; fill-opacity: 0.6; stroke: #82939a; stroke-width: 1.5; }
		#scene-adjusted .caption { fill: #234f31; stroke: none; font-weight: bold; }
	</style>
</head>
<body>
	<main>
		<h1>T04 – SVG House &amp; Garden</h1>
		<figure id="scene-original">
		<svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
			<title id="scene-title">A little house and garden</title>
			<desc id="scene-desc">A sunny garden with a cloud, leafy tree, small house, fence, and winding path.</desc>

			<rect x="0" y="0" width="800" height="320" fill="#d9f0f7" />
			<rect x="0" y="320" width="800" height="180" fill="#8acb78" />

			<circle cx="690" cy="85" r="42" fill="#ffd166" />
			<ellipse cx="175" cy="105" rx="54" ry="25" fill="#fff" />
			<circle cx="148" cy="98" r="22" fill="#fff" />
			<circle cx="180" cy="84" r="29" fill="#fff" />
			<circle cx="207" cy="101" r="20" fill="#fff" />

			<rect x="105" y="248" width="24" height="112" rx="3" fill="#805b3b" />
			<circle cx="117" cy="212" r="55" fill="#3e8f58" />
			<circle cx="82" cy="232" r="34" fill="#4da765" />
			<circle cx="148" cy="235" r="36" fill="#4da765" />

			<rect x="300" y="215" width="250" height="175" fill="#f2d3a0" />
			<polygon points="280,220 425,115 570,220" fill="#b95745" />
			<rect x="475" y="145" width="38" height="62" fill="#8d5144" />
			<rect x="394" y="300" width="62" height="90" fill="#76503d" />
			<circle cx="444" cy="347" r="4" fill="#ffd166" />
			<rect x="325" y="250" width="58" height="54" fill="#a8dce8" stroke="#76503d" stroke-width="6" />
			<line x1="354" y1="250" x2="354" y2="304" stroke="#76503d" stroke-width="4" />
			<line x1="325" y1="277" x2="383" y2="277" stroke="#76503d" stroke-width="4" />
			<rect x="472" y="250" width="48" height="54" fill="#a8dce8" stroke="#76503d" stroke-width="6" />
			<line x1="496" y1="250" x2="496" y2="304" stroke="#76503d" stroke-width="4" />
			<line x1="472" y1="277" x2="520" y2="277" stroke="#76503d" stroke-width="4" />

			<polyline points="40,365 40,320 72,320 72,365 104,365 104,320 136,320 136,365 168,365 168,320 200,320 200,365 232,365 232,320 264,320 264,365 292,365" fill="none" stroke="#f5f0dc" stroke-width="7" stroke-linejoin="round" />
			<line x1="40" y1="337" x2="292" y2="337" stroke="#f5f0dc" stroke-width="5" />
			<line x1="550" y1="365" x2="550" y2="320" stroke="#f5f0dc" stroke-width="7" />
			<line x1="582" y1="365" x2="582" y2="320" stroke="#f5f0dc" stroke-width="7" />
			<line x1="614" y1="365" x2="614" y2="320" stroke="#f5f0dc" stroke-width="7" />
			<line x1="646" y1="365" x2="646" y2="320" stroke="#f5f0dc" stroke-width="7" />
			<line x1="550" y1="337" x2="646" y2="337" stroke="#f5f0dc" stroke-width="5" />

			<path d="M 424 390 C 420 425, 480 430, 465 500 L 575 500 C 560 438, 520 422, 540 390 Z" fill="#d6bd91" />
			<text x="400" y="465" text-anchor="middle" fill="#355e3b" font-size="22">Welcome to the garden</text>
		</svg>
			<figcaption>Original scene</figcaption>
		</figure>
		<figure id="scene-annotated-figure">
			<svg id="scene-annotated" viewBox="0 0 800 500" role="img" aria-labelledby="scene-annotated-title scene-annotated-desc" xmlns="http://www.w3.org/2000/svg">
				<title id="scene-annotated-title">Annotated little house and garden</title>
				<desc id="scene-annotated-desc">The original garden scene with labels showing example SVG shape attributes.</desc>

				<rect x="0" y="0" width="800" height="320" fill="#d9f0f7" />
				<rect x="0" y="320" width="800" height="180" fill="#8acb78" />

				<circle cx="690" cy="85" r="42" fill="#ffd166" />
				<ellipse cx="175" cy="105" rx="54" ry="25" fill="#fff" />
				<circle cx="148" cy="98" r="22" fill="#fff" />
				<circle cx="180" cy="84" r="29" fill="#fff" />
				<circle cx="207" cy="101" r="20" fill="#fff" />

				<rect x="105" y="248" width="24" height="112" rx="3" fill="#805b3b" />
				<circle cx="117" cy="212" r="55" fill="#3e8f58" />
				<circle cx="82" cy="232" r="34" fill="#4da765" />
				<circle cx="148" cy="235" r="36" fill="#4da765" />

				<rect x="300" y="215" width="250" height="175" fill="#f2d3a0" />
				<polygon points="280,220 425,115 570,220" fill="#b95745" />
				<rect x="475" y="145" width="38" height="62" fill="#8d5144" />
				<rect x="394" y="300" width="62" height="90" fill="#76503d" />
				<circle cx="444" cy="347" r="4" fill="#ffd166" />
				<rect x="325" y="250" width="58" height="54" fill="#a8dce8" stroke="#76503d" stroke-width="6" />
				<line x1="354" y1="250" x2="354" y2="304" stroke="#76503d" stroke-width="4" />
				<line x1="325" y1="277" x2="383" y2="277" stroke="#76503d" stroke-width="4" />
				<rect x="472" y="250" width="48" height="54" fill="#a8dce8" stroke="#76503d" stroke-width="6" />
				<line x1="496" y1="250" x2="496" y2="304" stroke="#76503d" stroke-width="4" />
				<line x1="472" y1="277" x2="520" y2="277" stroke="#76503d" stroke-width="4" />

				<polyline points="40,365 40,320 72,320 72,365 104,365 104,320 136,320 136,365 168,365 168,320 200,320 200,365 232,365 232,320 264,320 264,365 292,365" fill="none" stroke="#f5f0dc" stroke-width="7" stroke-linejoin="round" />
				<line x1="40" y1="337" x2="292" y2="337" stroke="#f5f0dc" stroke-width="5" />
				<line x1="550" y1="365" x2="550" y2="320" stroke="#f5f0dc" stroke-width="7" />
				<line x1="582" y1="365" x2="582" y2="320" stroke="#f5f0dc" stroke-width="7" />
				<line x1="614" y1="365" x2="614" y2="320" stroke="#f5f0dc" stroke-width="7" />
				<line x1="646" y1="365" x2="646" y2="320" stroke="#f5f0dc" stroke-width="7" />
				<line x1="550" y1="337" x2="646" y2="337" stroke="#f5f0dc" stroke-width="5" />

				<path d="M 424 390 C 420 425, 480 430, 465 500 L 575 500 C 560 438, 520 422, 540 390 Z" fill="#d6bd91" />
				<text x="400" y="465" text-anchor="middle" fill="#355e3b" font-size="22">Welcome to the garden</text>

				<g id="annotations">
					<line x1="175" y1="80" x2="175" y2="48" />
					<text x="20" y="42">ellipse: cx=175, cy=105, rx=54, ry=25</text>
					<line x1="650" y1="50" x2="672" y2="66" />
					<text x="544" y="34">circle: cx=690, cy=85, r=42</text>
					<line x1="72" y1="320" x2="82" y2="392" />
					<text x="20" y="405">polyline: (40,365) (40,320) (72,320)</text>
					<line x1="354" y1="250" x2="330" y2="286" />
					<text x="180" y="300">line: (354,250) → (354,304)</text>
					<line x1="570" y1="220" x2="582" y2="226" />
					<text x="578" y="240">polygon: 280,220 425,115 570,220</text>
					<line x1="424" y1="390" x2="552" y2="468" />
					<text x="560" y="480">path: M424 390 C420 425... L575 500</text>
					<line x1="400" y1="465" x2="552" y2="416" />
					<text x="560" y="420">text: x=400, y=465</text>
					<line x1="620" y1="320" x2="620" y2="475" />
					<text x="536" y="492">rect: x=0, y=320, width=800, height=180</text>
				</g>
			</svg>
			<figcaption>Annotated scene (Step 2)</figcaption>
		</figure>
		<figure id="scene-adjusted-figure">
			<svg id="scene-adjusted" viewBox="0 0 800 500" role="img" aria-labelledby="scene-adjusted-title scene-adjusted-desc" xmlns="http://www.w3.org/2000/svg">
				<title id="scene-adjusted-title">Adjusted house and garden</title>
				<desc id="scene-adjusted-desc">A house and tree with stronger colors, a dashed fence, curved stone path, mailbox, and chimney smoke.</desc>

				<rect class="sky" x="0" y="0" width="800" height="320" fill="#d9f0f7" />
				<rect class="lawn" x="0" y="320" width="800" height="180" fill="#8acb78" />

				<circle cx="690" cy="85" r="42" fill="#ffd166" />
				<ellipse cx="175" cy="105" rx="54" ry="25" fill="#fff" />
				<circle cx="148" cy="98" r="22" fill="#fff" />
				<circle cx="180" cy="84" r="29" fill="#fff" />
				<circle cx="207" cy="101" r="20" fill="#fff" />

				<!-- Shift the tree slightly right to balance the house. -->
				<g transform="translate(12 0)">
					<rect class="tree-trunk" x="105" y="248" width="24" height="112" rx="3" fill="#805b3b" />
					<circle class="tree-canopy" cx="117" cy="212" r="55" fill="#3e8f58" />
					<circle class="tree-canopy" cx="82" cy="232" r="34" fill="#4da765" />
					<circle class="tree-canopy" cx="148" cy="235" r="36" fill="#4da765" />
				</g>

				<!-- Nudge the complete house a few units to the right. -->
				<g transform="translate(8 0)">
					<rect class="house-body" x="300" y="215" width="250" height="175" fill="#f2d3a0" />
					<polygon class="roof" points="280,220 425,115 570,220" fill="#b95745" />
					<rect class="chimney" x="475" y="145" width="38" height="62" fill="#8d5144" />
					<rect class="door" x="394" y="300" width="62" height="90" fill="#76503d" />
					<circle cx="444" cy="347" r="4" fill="#ffd166" />
					<rect class="window" x="325" y="250" width="58" height="54" fill="#a8dce8" stroke="#76503d" stroke-width="6" />
					<line class="window-divider" x1="354" y1="250" x2="354" y2="304" stroke="#76503d" stroke-width="4" />
					<line class="window-divider" x1="325" y1="277" x2="383" y2="277" stroke="#76503d" stroke-width="4" />
					<rect class="window" x="472" y="250" width="48" height="54" fill="#a8dce8" stroke="#76503d" stroke-width="6" />
					<line class="window-divider" x1="496" y1="250" x2="496" y2="304" stroke="#76503d" stroke-width="4" />
					<line class="window-divider" x1="472" y1="277" x2="520" y2="277" stroke="#76503d" stroke-width="4" />
				</g>

				<g class="fence">
					<polyline points="40,365 40,320 72,320 72,365 104,365 104,320 136,320 136,365 168,365 168,320 200,320 200,365 232,365 232,320 264,320 264,365 292,365" fill="none" stroke="#f5f0dc" stroke-width="7" stroke-linejoin="round" />
					<line x1="40" y1="337" x2="292" y2="337" stroke="#f5f0dc" stroke-width="5" />
					<line x1="550" y1="365" x2="550" y2="320" stroke="#f5f0dc" stroke-width="7" />
					<line x1="582" y1="365" x2="582" y2="320" stroke="#f5f0dc" stroke-width="7" />
					<line x1="614" y1="365" x2="614" y2="320" stroke="#f5f0dc" stroke-width="7" />
					<line x1="646" y1="365" x2="646" y2="320" stroke="#f5f0dc" stroke-width="7" />
					<line x1="550" y1="337" x2="646" y2="337" stroke="#f5f0dc" stroke-width="5" />
				</g>

				<path class="garden-path" d="M 424 390 C 420 425, 480 430, 465 500 L 575 500 C 560 438, 520 422, 540 390 Z" />
				<!-- Overlay a lighter curved walk and joints to read as individual stones. -->
				<path class="stone-walkway" d="M 430 390 C 426 425, 472 438, 456 500 L 566 500 C 553 438, 514 425, 534 390 Z" />
				<path class="stone-joint" d="M 426 430 C 455 438, 505 438, 529 430 M 422 454 C 449 462, 500 462, 541 454 M 415 480 C 445 488, 493 488, 558 480" />

				<!-- Add a mailbox beside the right edge of the path. -->
				<g class="mailbox">
					<rect x="572" y="365" width="6" height="34" />
					<rect x="559" y="347" width="32" height="22" rx="3" />
					<polygon points="559,350 575,339 591,350" />
				</g>

				<!-- Let a few soft ellipses drift up from the chimney. -->
				<ellipse class="smoke" cx="497" cy="137" rx="8" ry="6" />
				<ellipse class="smoke" cx="508" cy="119" rx="12" ry="8" />
				<ellipse class="smoke" cx="496" cy="99" rx="9" ry="6" />

				<text class="caption" x="400" y="465" text-anchor="middle" font-size="22">Welcome to the garden</text>
			</svg>
			<figcaption>Adjusted scene (Step 3)</figcaption>
		</figure>
		<figure id="scene-grouped-figure">
			<svg id="scene-grouped" viewBox="0 0 800 500" role="img" aria-labelledby="scene-grouped-title scene-grouped-desc" xmlns="http://www.w3.org/2000/svg">
				<title id="scene-grouped-title">House and garden with grouped windows</title>
				<desc id="scene-grouped-desc">The original house and garden scene with both windows built from one reusable group.</desc>

				<defs>
					<!-- Grouping the frame and mullions lets both windows reuse identical markup. -->
					<g id="window">
						<rect x="0" y="0" width="35" height="30" fill="#a8dce8" stroke="#76503d" stroke-width="6" />
						<line x1="17.5" y1="0" x2="17.5" y2="30" stroke="#76503d" stroke-width="4" />
						<line x1="0" y1="15" x2="35" y2="15" stroke="#76503d" stroke-width="4" />
					</g>
				</defs>

				<rect x="0" y="0" width="800" height="320" fill="#d9f0f7" />
				<rect x="0" y="320" width="800" height="180" fill="#8acb78" />

				<circle cx="690" cy="85" r="42" fill="#ffd166" />
				<ellipse cx="175" cy="105" rx="54" ry="25" fill="#fff" />
				<circle cx="148" cy="98" r="22" fill="#fff" />
				<circle cx="180" cy="84" r="29" fill="#fff" />
				<circle cx="207" cy="101" r="20" fill="#fff" />

				<rect x="105" y="248" width="24" height="112" rx="3" fill="#805b3b" />
				<circle cx="117" cy="212" r="55" fill="#3e8f58" />
				<circle cx="82" cy="232" r="34" fill="#4da765" />
				<circle cx="148" cy="235" r="36" fill="#4da765" />

				<rect x="300" y="215" width="250" height="175" fill="#f2d3a0" />
				<polygon points="280,220 425,115 570,220" fill="#b95745" />
				<rect x="475" y="145" width="38" height="62" fill="#8d5144" />
				<rect x="394" y="300" width="62" height="90" fill="#76503d" />
				<circle cx="444" cy="347" r="4" fill="#ffd166" />
				<!-- These translations match the original window origins (325,250) and (472,250). -->
				<use href="#window" transform="translate(325 250)" />
				<use href="#window" transform="translate(472 250)" />

				<polyline points="40,365 40,320 72,320 72,365 104,365 104,320 136,320 136,365 168,365 168,320 200,320 200,365 232,365 232,320 264,320 264,365 292,365" fill="none" stroke="#f5f0dc" stroke-width="7" stroke-linejoin="round" />
				<line x1="40" y1="337" x2="292" y2="337" stroke="#f5f0dc" stroke-width="5" />
				<line x1="550" y1="365" x2="550" y2="320" stroke="#f5f0dc" stroke-width="7" />
				<line x1="582" y1="365" x2="582" y2="320" stroke="#f5f0dc" stroke-width="7" />
				<line x1="614" y1="365" x2="614" y2="320" stroke="#f5f0dc" stroke-width="7" />
				<line x1="646" y1="365" x2="646" y2="320" stroke="#f5f0dc" stroke-width="7" />
				<line x1="550" y1="337" x2="646" y2="337" stroke="#f5f0dc" stroke-width="5" />

				<path d="M 424 390 C 420 425, 480 430, 465 500 L 575 500 C 560 438, 520 422, 540 390 Z" fill="#d6bd91" />
				<text x="400" y="465" text-anchor="middle" fill="#355e3b" font-size="22">Welcome to the garden</text>
			</svg>
			<figcaption>Grouped windows scene (Step 4)</figcaption>
		</figure>
	</main>
</body>
</html>
